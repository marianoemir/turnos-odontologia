server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # D1: la barra final de proxy_pass quita el prefijo /api, igual que el rewrite
    # del proxy de Vite. Se declara antes de location / para ganar por prefijo.
    location /api/ {
        proxy_pass http://api:8000/;
    }

    # D3: el index.html no se cachea para no quedar pegado a un bundle viejo.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # D3: una recarga directa de una ruta interna devuelve el SPA, no un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
