  <!-- Pieza dental tenue: solo insinúa el dominio, no compite con la leyenda -->
  <path d="M48 20c-7 0-11 4-11 10.1 0 3.4.7 5.9 1.5 8.7.8 2.8 1.4 5.8 1.8 8.7.3 2.4.7 5.4 2.1 5.4 1.5 0 2.1-2.9 2.6-5.6.4-2.3.9-4.2 3-4.2s2.6 1.9 3 4.2c.5 2.7 1.1 5.6 2.6 5.6 1.4 0 1.8-3 2.1-5.4.4-2.9 1-5.9 1.8-8.7.8-2.8 1.5-5.3 1.5-8.7C59 24 55 20 48 20Z"
