  <!-- Leyenda dominante: se lee a tamaño de interfaz -->
  <text x="48" y="79" text-anchor="middle" font-family="system-ui, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="700" letter-spacing="0.5" fill="#96600F">PROV.</text>
