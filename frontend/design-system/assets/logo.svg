<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="logo-titulo logo-desc">
  <title id="logo-titulo">Marca provisoria</title>
  <desc id="logo-desc">Placeholder de logo: marco ocre punteado, pieza dental tenue y la palabra PROV. Marca de reemplazo, no aprobada.</desc>
  <!-- Marco punteado ocre: señal de que la identidad no está definida -->
