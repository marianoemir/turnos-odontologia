name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odontologia
          POSTGRES_PASSWORD: odontologia
          POSTGRES_DB: turnos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odontologia -d turnos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      TZ: America/Argentina/Buenos_Aires
      DATABASE_URL: postgresql+psycopg://odontologia:odontologia@localhost:5432/turnos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: pytest -rs backend/tests
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend/
