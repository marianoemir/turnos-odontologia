services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: odontologia
      POSTGRES_PASSWORD: odontologia
      POSTGRES_DB: turnos
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odontologia -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://odontologia:odontologia@postgres:5432/turnos
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:

