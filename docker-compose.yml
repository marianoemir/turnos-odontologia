services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: odontologia
      POSTGRES_PASSWORD: odontologia
      POSTGRES_DB: turnos
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odontologia -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://odontologia:odontologia@postgres:5432/turnos
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

